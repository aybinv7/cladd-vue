name: release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - run: bun install --frozen-lockfile

      - run: bunx vp run cladd-vue#check

      - run: bunx vp run cladd-vue#test -- --run

      - run: bunx vp run cladd-vue#build

      - run: |
          mkdir -p "$RUNNER_TEMP/cladd-vue-package"
          cp -R packages/ui/. "$RUNNER_TEMP/cladd-vue-package/"
          cd "$RUNNER_TEMP/cladd-vue-package"
          npm publish --provenance --access public --ignore-scripts
